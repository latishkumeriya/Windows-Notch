name: release

# Publish a GitHub Release with NotchWin.exe attached.
#
# Normally triggered by pushing a tag like v0.3.0. It can also be run manually
# (Actions -> release -> Run workflow) to publish or refresh an existing tag.
#
# The job is idempotent: if the release already exists - e.g. it was created by
# hand in the GitHub UI before the tag was pushed - it is updated in place instead
# of failing the run.
#
# The exe is code-signed with Azure Artifact Signing when the repository variables
# listed in docs/SIGNING.md are set; otherwise the release is published unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.0.0"
        required: false
        default: ""
        type: string

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # OIDC login to Azure; no stored Azure password

jobs:
  release:
    runs-on: windows-2025
    # The Azure federated credential trusts this environment, so only this job can sign.
    environment: release
    env:
      SIGNING_ENABLED: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
    steps:
      # A tag push gives us the tag in the ref; a manual run passes it as an input.
      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:DISPATCH_TAG) { $env:DISPATCH_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v[0-9]') { throw "Not a version tag: '$tag'" }
          Write-Host "Publishing tag $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.tag }}".TrimStart("v")
          dotnet publish src/NotchWin/NotchWin.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:Version=$version -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item publish\*.pdb -ErrorAction SilentlyContinue

      - name: Azure login (OIDC)
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign NotchWin.exe
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\publish
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature publish\NotchWin.exe
          Write-Host "Status: $($sig.Status)  Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "NotchWin.exe is not validly signed" }

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $tag = $env:TAG
          $hash = (Get-FileHash publish\NotchWin.exe -Algorithm SHA256).Hash.ToLower()
          $signed = if ($env:SIGNING_ENABLED -eq "true") { "Code-signed with Azure Artifact Signing." } else { "Unsigned build: Windows/Chrome may warn (see README)." }
          $notes = "$signed`n`nSHA-256 of NotchWin.exe: ``$hash``"

          # Pass the notes via a file: multi-line text with backticks is fragile in argv.
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [IO.File]::WriteAllText($notesFile, $notes, [Text.UTF8Encoding]::new($false))

          # The release may already exist - e.g. it was created by hand in the GitHub
          # UI before the tag was pushed. Update it in place instead of failing.
          # Listing is used rather than `gh release view` because a missing release
          # makes `view` exit non-zero, which would abort the step before we can
          # fall through to the create branch.
          $existing = gh release list --limit 1000 --json tagName | ConvertFrom-Json |
            Where-Object { $_.tagName -eq $tag }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existing) {
            Write-Host "Release $tag already exists - updating it."
            gh release upload $tag publish\NotchWin.exe --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title "NotchWin $tag" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag publish\NotchWin.exe --title "NotchWin $tag" --notes-file $notesFile --verify-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
